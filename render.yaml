services:
  - type: web
    name: zizzet-recovery-engine
    env: python
    runtime: python-3.10.14
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./zizzet_recovery.db
      - key: PROMPT_VERSION
        value: v1.0.0
      - key: QUEUE_TYPE
        value: in_memory
